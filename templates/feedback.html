<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ t.feedback }}</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("/static/images/farmer-background.jpg");

    background-size:cover;
    background-position:center;
}

.feedback-box{
    width:450px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(12px);
    border-radius:15px;
    padding:35px;
    color:white;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

select,
textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:20px;
    font-size:16px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#2E7D32;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1B5E20;
}

</style>

</head>

<body>

<div class="feedback-box">

<h2>🌾 {{ t.feedback }}</h2>

<form action="/submit_feedback/{{ booking._id }}" method="POST">

<label>{{ t.rating }}</label>

<select name="rating" required>

<option value="5">⭐⭐⭐⭐⭐ (5)</option>
<option value="4">⭐⭐⭐⭐ (4)</option>
<option value="3">⭐⭐⭐ (3)</option>
<option value="2">⭐⭐ (2)</option>
<option value="1">⭐ (1)</option>

</select>

<label>{{ t.comments }}</label>

<textarea
name="comments"
rows="5"
placeholder="{{ t.enter_comments }}"
required></textarea>

<button type="submit">

{{ t.submit_feedback }}

</button>

</form>

</div>

</body>

</html>
