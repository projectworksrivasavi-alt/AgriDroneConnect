<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriDrone Connect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:url("{{ url_for('static', filename='images/background.jpeg') }}");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

}

/* Dark Overlay */

.overlay{

    width:100%;
    height:100vh;

    background:rgba(0,0,0,.45);

    display:flex;
    justify-content:center;
    align-items:center;

}

/* Glass Card */

.container{

    width:520px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(12px);

    border-radius:20px;

    padding:50px;

    text-align:center;

    color:white;

    box-shadow:0 10px 30px rgba(0,0,0,.4);

}

.container h1{

    font-size:46px;

    margin-bottom:15px;

}

.container h3{

    font-size:20px;

    font-weight:400;

    margin-bottom:35px;

}

.btn{

    display:block;

    width:100%;

    padding:16px;

    margin:18px 0;

    border-radius:8px;

    text-decoration:none;

    font-size:18px;

    font-weight:600;

    color:white;

    transition:.3s;

}

.farmer{

    background:#28a745;

}

.operator{

    background:#007bff;

}

.admin{

    background:#dc3545;

}

.btn:hover{

    transform:translateY(-4px);

    box-shadow:0 10px 20px rgba(0,0,0,.3);

}

.footer{

    margin-top:30px;

    font-size:14px;

    color:#f5f5f5;

}

</style>

</head>

<body>

<div class="overlay">

<div class="container">

<h1>𖥂 AgriDrone Connect</h1>

<h3>
Smart Agriculture Drone Service Platform
</h3>

<a href="/language" class="btn farmer">
🌾 Farmer Login
</a>

<a href="/operator" class="btn operator">
𖥂 Drone Operator Login
</a>

<a href="/admin" class="btn admin">
🛡 Admin Login
</a>

<div class="footer">

Developed for Smart Agriculture using Drone Technology

<br><br>

© 2026 AgriDrone Connect

</div>

</div>

</div>

</body>

</html>
