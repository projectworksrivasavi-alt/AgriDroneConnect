<!DOCTYPE html>
<html>
<head>

<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("/static/images/admin-bg.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

}

.login-box{

    width:400px;

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(15px);

    border-radius:20px;

    padding:40px;

    box-shadow:0 15px 35px rgba(0,0,0,.4);

    color:white;

}

.logo{

    text-align:center;

    font-size:60px;

    margin-bottom:10px;

}

h2{

    text-align:center;

    margin-bottom:30px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}

input[type=text],
input[type=password]{

    width:100%;

    padding:13px;

    border:none;

    outline:none;

    border-radius:8px;

    margin-bottom:20px;

    font-size:16px;

}

.show-password{

    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:20px;

    font-size:15px;

}

.show-password input{

    width:auto;

}

button{

    width:100%;

    padding:14px;

    background:#2E7D32;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1B5E20;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
🔐
</div>

<h2>Admin Login</h2>

<form action="/admin_login" method="POST">

<label>Username</label>

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<label>Password</label>

<input
type="password"
id="password"
name="password"
placeholder="Enter Password"
required>

<div class="show-password">

<input
type="checkbox"
onclick="togglePassword()">

<span>Show Password</span>

</div>

<button type="submit">

Login

</button>

</form>

</div>

<script>

function togglePassword(){

    var password=document.getElementById("password");

    if(password.type==="password"){

        password.type="text";

    }else{

        password.type="password";

    }

}

</script>

</body>

</html>
