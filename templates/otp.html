<!DOCTYPE html>
<html>

<head>

<title>{{ t.verify_otp }}</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:400px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
    text-align:center;
}

h2{
    color:#2E7D32;
}

.otp{
    font-size:35px;
    color:red;
    font-weight:bold;
    margin:20px 0;
}

input{
    width:100%;
    padding:12px;
    margin:15px 0;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#2E7D32;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1B5E20;
}

</style>

</head>

<body>

<div class="box">

<h2>{{ t.send_otp }}</h2>

<p>
{{ t.mobile }} :
<b>{{ mobile }}</b>
</p>

<p><b>{{ t.enter_otp }}</b></p>

<div class="otp">
{{ otp }}
</div>

<form action="/verify_otp" method="POST">

<input
type="hidden"
name="mobile"
value="{{ mobile }}">

<input
type="text"
name="otp"
placeholder="{{ t.otp_placeholder }}"
required>

<button type="submit">
{{ t.verify_otp }}
</button>
<script>

function sendOTP() {

    const mobile = document.getElementById("mobileInput").value;

    if (mobile.trim() === "") {
        alert("{{ t.mobile_placeholder }}");
        return;
    }

    const formData = new FormData();
    formData.append("mobile", mobile);

    fetch("/send_otp", {
        method: "POST",
        body: formData
    })
    .then(response => response.text())
    .then(html => {
        document.open();
        document.write(html);
        document.close();
    })
    .catch(error => {
        console.error(error);
        alert("Failed to send OTP.");
    });

}

</script>
</form>

</div>

</body>

</html>
